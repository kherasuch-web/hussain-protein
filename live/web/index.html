<style>
@font-face{font-family:"Jameel Noori";src:url(fonts/jameel-noori.woff2) format("woff2");font-display:swap}
:root{--bg:#eef3f8;--card:#fff;--fg:#0f1d2b;--mut:#34485c;--line:#c5d3e0;--accent:#1c5d93;--accent2:#173f66;--soft:#dce9f5;--err:#b42318;--errbg:#fdecea;--warn:#8a5a00;--warnbg:#fff4d6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}
.ur{font-family:"Jameel Noori","Noto Nastaliq Urdu",serif;line-height:2;direction:rtl;unicode-bidi:plaintext}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}

#umenu{width:42px;height:42px;border-radius:999px!important;padding:0!important;display:grid;place-items:center;flex:none}
.usheet{position:fixed;inset:0;z-index:100}.usheet[hidden]{display:none}
.usheet .sb{position:absolute;inset:0;background:rgba(10,25,40,.45)}

.usheet .si{display:flex;align-items:center;gap:14px;width:100%;background:none!important;border:0;padding:14px 6px;font-size:17px;font-weight:600;color:#1c2a24;text-align:left;border-radius:12px}
.usheet .si[hidden]{display:none}.usheet .si svg{width:26px;height:26px;color:#1c5d93;flex:none}.usheet .si small{display:block;font-weight:400;font-size:13px;color:#5d6b64}

.net{font-size:12.5px;text-align:center;padding:4px 8px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:18px;margin:0 0 10px}
p.mut,.mut{color:var(--mut);font-size:14px}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input[type=text],input[type=email],input[type=password]{width:100%;font-size:17px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--fg)}

.btn.pri{background:var(--accent);color:#fff}
.btn.sec{background:var(--soft);color:var(--accent2)}

.link{background:none;border:0;color:var(--accent);font-size:15px;padding:10px 0;text-decoration:underline;cursor:pointer}
.msg{margin-top:12px;font-size:14.5px;border-radius:10px;padding:10px 12px}
.msg:empty{display:none}

.tabs2{display:flex;gap:8px;margin-top:18px}

.fcard{margin-top:12px}.fcard .farm{margin-top:0;border-radius:14px 14px 0 0}.fset{display:block;width:100%;border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;background:#fafcfb;color:var(--accent2);padding:9px;font-size:14px;font-weight:600}

.sumn{font-size:13px;color:var(--warn);margin-top:4px}
.sumt{font-size:12.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 6px}
.sumg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sumg div{background:#f6f9f7;border-radius:9px;padding:7px 10px;display:flex;flex-direction:column;min-width:0}
.sumg span{font-size:12px;color:var(--mut)}
.sumg b{font-size:17px;font-variant-numeric:tabular-nums}
.sumg .big{grid-column:1/-1;background:var(--soft);flex-direction:row;justify-content:space-between;align-items:center}
.sumg .big b{font-size:20px;color:var(--accent2)}
.sumg .big.neg b{color:var(--err)}
.farm .chev{color:var(--mut);font-size:20px}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--soft);color:var(--accent2);margin-left:6px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .k{color:var(--mut);font-size:14px}
.row .v{font-weight:600;text-align:right}
.sw{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px}
.sw input{width:22px;height:22px;accent-color:var(--accent)}

.dev .d{flex:1}
.dev button{border:0;background:var(--errbg);color:var(--err);border-radius:9px;padding:7px 10px;font-weight:600}
.empty{color:var(--mut);text-align:center;padding:18px 0;font-size:14.5px}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--accent);font-size:13.5px;padding:8px}

.lastin{margin-top:6px;font-size:13.5px;color:var(--mut)}.lastin b{color:var(--fg)}
.emerg{text-align:center;margin-top:22px}.ebtn{background:none;border:1px dashed var(--line);color:var(--mut);border-radius:10px;padding:7px 14px;font-size:13px}
.ver{text-align:center;color:var(--mut);font-size:12.5px;margin:26px 0 8px;opacity:.85}
/* v1.26.4: version line always at the very bottom of the window (or below the content when the page is long) */
.wrap:has(>.ver){position:relative;min-height:100vh;min-height:100dvh;box-sizing:border-box;padding-bottom:56px!important}
/* v1.26.6: older phone WebViews do not know :has() -> app.js adds .hasver to the parent, so the version line never covers buttons */
.wrap.hasver{position:relative;min-height:100vh;min-height:100dvh;box-sizing:border-box;padding-bottom:56px!important}

#backtoast.show{opacity:1}
.boot-wait{min-height:60vh}
[hidden]{display:none!important}
</style>

<script>/* v1.25 Windows: sidebar on Main home */(function(){
 const ic={farms:'<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',add:'<path d="M12 5v14M5 12h14"/>',phones:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',req:'<path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/>',gd:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>'};
 const sv=k=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ic[k]+'</svg>';
 let nav=null,last="";
 function up(){const app=document.getElementById("app");if(!app)return;const home=!!document.getElementById("farms");
  if(!nav){nav=document.createElement("nav");nav.id="dkNav";nav.setAttribute("aria-label","Main menu");document.body.append(nav)}
  if(!home){last="";return}
  const sub=((document.querySelector("header.top .t span")||{}).textContent||"").trim();
  const items=[["farms","All farms","farms"]];
  if(document.getElementById("add"))items.push(["add","+ Add Farm","add"]);
  if(document.getElementById("phones"))items.push(["phones","Phones","phones"]);
  if(document.querySelector("#reqs .card,#mvreq .card"))items.push(["req","Requests","reqs"]);
  if(document.getElementById("gd")||document.getElementById("bkp"))items.push(["gd","Backup",document.getElementById("gd")?"gd":"bkp"]);
  const key=sub+"|"+items.map(i=>i[0]).join(",");if(key===last)return;last=key;
  const who=sub.split("·").map(x=>x.trim()).filter(Boolean);const nm=who.length>2?who[1]:who[0]||"Main";
  nav.innerHTML='<div class="bt"><span>Hussain Protein<br>Broiler Farm App</span><img src="img/logo-192.png" alt=""></div>'+items.map((i,n)=>'<button type="button" data-go="'+i[2]+'"'+(n?'':' class="on"')+'><span>'+i[1]+'</span>'+sv(i[0])+'</button>').join("")+'<div class="ft"><span class="dot"></span><div><b></b><small>all farms</small></div><span class="av"></span></div>';
  nav.querySelector(".ft b").textContent=nm;nav.querySelector(".ft .av").textContent=(nm[0]||"M").toUpperCase();
  nav.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{nav.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));const id=b.dataset.go,el=document.getElementById(id);if(!el)return;
   if(id==="add"){el.click();return}if(id==="farms"){scrollTo({top:0,behavior:"smooth"});return}el.scrollIntoView({behavior:"smooth",block:"start"})})}
 if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",()=>{up();setInterval(up,700)});else{up();setInterval(up,700)}})();</script>
<script>/* v1.25 Windows: Enter in the login boxes = Log in */document.addEventListener("keydown",e=>{if(e.key!=="Enter"||!matchMedia("(min-width:1000px)").matches||e.defaultPrevented)return;const t=e.target;if(!t||!t.matches||!t.matches("input"))return;const c=t.closest(".card");if(!c)return;const go=c.querySelector("#go,#fgo,#fpok,#mk,#cpok,#gmok");if(!go||go.disabled)return;const f=[...c.querySelectorAll("input")].filter(x=>x.offsetParent!==null&&!x.disabled&&x.type!=="checkbox");const i=f.indexOf(t);e.preventDefault();if(i>-1&&i<f.length-1)f[i+1].focus();else go.click()});</script>
